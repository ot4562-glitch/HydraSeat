name: HydraSeat CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC & CMake
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Python for roadmap validation
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Validate implementation roadmap
      run: python tools/validate_implementation_roadmap.py

    - name: Validate current Codex packet prompt
      run: python tools/show_implementation_packet.py --current --prompt

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release --parallel

    - name: Run Engine Unit Tests
      run: ctest --test-dir build --build-config Release --output-on-failure
